<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a305f">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Expenses Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin: 0; height: 100%; background: #0b162d; overflow: hidden; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #f6f7fb; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #e2e8f0; background: #0b162d; transition: opacity .3s; z-index: 2; padding: 24px; text-align: center; }
  #splash img { width: 88px; height: 88px; }
  #splash.hidden { opacity: 0; pointer-events: none; }
  .spin { width: 26px; height: 26px; border: 3px solid #334155; border-top-color: #818cf8; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #help { display: none; max-width: 320px; font-size: 14px; line-height: 1.5; color: #cbd5e1; }
  #help.show { display: block; }
  .btn { display: inline-block; margin: 6px 4px 0; padding: 10px 16px; border-radius: 12px; border: 0; font: 600 14px system-ui, sans-serif; text-decoration: none; cursor: pointer; }
  .primary { background: #6366f1; color: #fff; }
  .ghost { background: #1e293b; color: #e2e8f0; }
</style>
</head>
<body>
<div id="splash">
  <img src="icon-192.png" alt="">
  <div class="spin" id="spin"></div>
  <div id="help">
    <p>Your tracker didn't load inside the app. Usually this means Chrome isn't signed in to your Google account, or the launcher address isn't allowed yet (Script Property <b>LAUNCHER_ORIGINS</b>).</p>
    <a class="btn primary" id="open" target="_blank" rel="noopener">Open in Chrome</a>
    <button class="btn ghost" onclick="location.reload()">Retry</button>
    <button class="btn ghost" onclick="document.getElementById('splash').classList.add('hidden')">Show anyway</button>
  </div>
</div>
<iframe id="app" title="Expenses Tracker" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
<script>
  var EXEC_URL = "https://script.google.com/macros/s/AKfycbwH974UnAsLiYAkve7PEWIiDk8bTZu0sWym6Mvb0sz9LKra1S61ojWx4K3khKpPRQJt_w/exec";
  var splash = document.getElementById('splash');
  document.getElementById('open').href = EXEC_URL;
  var ready = false;
  // The app posts this message from inside Google's frames once your data has loaded.
  window.addEventListener('message', function (e) {
    if (e.data && e.data.type === 'expenses-tracker-ready' && /(^https:\/\/script\.google\.com$)|(\.googleusercontent\.com$)/.test(e.origin)) {
      ready = true;
      splash.classList.add('hidden');
    }
  });
  document.getElementById('app').src = EXEC_URL;
  setTimeout(function () {
    if (ready) return;
    document.getElementById('spin').style.display = 'none';
    document.getElementById('help').classList.add('show');
  }, 15000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
